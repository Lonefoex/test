name: Remote Playwright CDP Server
on: 
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI

jobs:
  run-chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloudflared
        run: |
          sudo mkdir -p --mode=0755 /etc/apt/keyrings
          curl -fsSL https://cloudflare.com | sudo gpg --dearmor -o /etc/apt/keyrings/cloudflare-main.gpg
          echo "deb [signed-by=/etc/apt/keyrings/cloudflare-main.gpg] https://cloudflare.com stable main" | sudo tee /etc/apt/sources.list.d/cloudflare-main.list
          sudo apt-get update && sudo apt-get install -y cloudflared xvfb google-chrome-stable

      - name: Start Xvfb and Google Chrome with CDP
        run: |
          # 1. Start the virtual display buffer in the background
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          
          # 2. Launch real Google Chrome bound to the virtual display
          # Crucial: --remote-allow-origins=* stops the HTTP 500/Host rejection error
          google-chrome-stable \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --headless=false &
            
          # Give Chrome a few seconds to fully initialize
          sleep 5

      - name: Start Cloudflare Quick Tunnel & Keep Alive
        run: |
          echo "--------------------------------------------------------"
          echo "LOOK BELOW FOR YOUR TEMPORARY TRYCLOUDFLARE URL"
          echo "--------------------------------------------------------"
          
          # Start cloudflared routing to Chrome's CDP port. 
          # The workflow will stay active and running until you manually cancel it.
          cloudflared tunnel --url http://localhost:9222
