name: Remote Playwright CDP Server
on: 
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI

jobs:
  run-chrome:
    # Explicitly pinning to 24.04 prevents issues with the shifting ubuntu-latest label
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Install Cloudflared Binary
        run: |
          # Download the official pre-compiled Linux binary directly
          curl -L https://github.com -o cloudflared
          chmod +x cloudflared
          # Move it to system path so it can be called globally
          sudo mv cloudflared /usr/local/bin/

      - name: Start Xvfb and Google Chrome with CDP
        run: |
          # 1. Start the virtual display buffer in the background (Pre-installed on runner)
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          
          # 2. Launch Google Chrome (Pre-installed on runner)
          google-chrome \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --headless=false &
            
          # Give Chrome a moment to initialize the debugging port
          sleep 5

      - name: Start Cloudflare Quick Tunnel & Keep Alive
        run: |
          echo "--------------------------------------------------------"
          echo "STARTING TUNNEL TO CHROME CDP PORT..."
          echo "--------------------------------------------------------"
          
          # 1. Run the tunnel in the background and redirect output to a log file
          # Adding --http2-origin forces cloudflared to handle persistent connections properly
          cloudflared tunnel --url http://127.0.0.1:9222 --http2-origin=true > cloudflared.log 2>&1 &
          
          # 2. Wait a few seconds for the tunnel to establish and claim the ephemeral URL
          sleep 8
          
          # 3. Print the tunnel log containing the "trycloudflare.com" address to the console
          cat cloudflared.log
          
          echo "--------------------------------------------------------"
          echo "KEEPING WORKFLOW ALIVE FOR REMOTE PLAYWRIGHT SESSIONS..."
          echo "--------------------------------------------------------"
          
          # 4. Tail the log file continuously to keep the step alive.
          # The workflow will stay active and running until you manually stop it.
          tail -f cloudflared.log

