name: Undetectable Bot Bypass Run

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger manually from the GitHub UI

jobs:
  run-stealth-browser:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Project Dependencies
      run: |
        npm install
        # Ensure 'camoufox' and 'playwright' are installed in your package.json

    - name: Install System Dependencies for Camoufox & Virtual Display
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb dbus-x11 xauth libgtk-3-0 libdbus-glib-1-2 libxt6 wmctrl fluxbox


    - name: Fetch Camoufox Stealth Binaries
      run: npx camoufox fetch

    - name: Fix Camoufox Binary Permissions
      run: |
        chmod -R 755 "/home/runner/.cache/camoufox"
        chmod +x "/home/runner/.cache/camoufox/camoufox-bin"

    # FIX 2: Force explicit local installation of both required automation libraries
    - name: Install Runtime Automation Packages
      run: npm install camoufox playwright

    - name: Start Xvfb and Camoufox in Background
      env:
        DISPLAY: :99
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2
        npx camoufox --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 &
        sleep 5

    - name: Execute Playwright Script
      run: node stealth-connect.js

    # Optional: Upload screenshots or data generated during the run to view later
    - name: Upload Fingerprint Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stealth-screenshots
        path: ./fingerprint_result.png
