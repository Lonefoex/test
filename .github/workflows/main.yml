
name: Remote Chrome CDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            wget \
            ca-certificates \
            nodejs \
            npm

          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            -O /tmp/chrome.deb

          sudo apt-get install -y /tmp/chrome.deb

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

      - name: Install Node dependencies
        run: npm install http-proxy

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1365x768x24 \
            -ac +extension GLX +render -noreset \
            > /tmp/xvfb.log 2>&1 &

          echo $! > /tmp/xvfb.pid
          sleep 2

      - name: Start Chrome
        env:
          DISPLAY: :99
        run: |
          mkdir -p /tmp/remote-chrome-profile

          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --no-first-run \
            --no-default-browser-check \
            --user-data-dir=/tmp/remote-chrome-profile \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            about:blank \
            > /tmp/chrome.log 2>&1 &

          echo $! > /tmp/chrome.pid

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              echo "Chrome CDP is ready"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/chrome.log
          exit 1

      - name: Start Node gateway
        run: |
          node gateway.js > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/json/version >/dev/null; then
              echo "Gateway is ready"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/gateway.log
          exit 1

      - name: Start Cloudflare Quick Tunnel
  run: |
    cloudflared tunnel \
      --no-autoupdate \
      --url http://127.0.0.1:9222 \
      > /tmp/cloudflared.log 2>&1 &

    echo $! > /tmp/cloudflared.pid

    for i in $(seq 1 60); do
      URL=$(grep -Eo \
        'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
        /tmp/cloudflared.log | head -n 1 || true)

      if [ -n "$URL" ]; then
        echo "REMOTE CHROME URL: $URL"
        break
      fi

      sleep 2
    done

    if [ -z "${URL:-}" ]; then
      cat /tmp/cloudflared.log
      exit 1
    fi

    sleep 20400
