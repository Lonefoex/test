
name: Remote Chrome CDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget curl ca-certificates

          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            -O /tmp/chrome.deb
          sudo apt-get install -y /tmp/chrome.deb

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Start virtual display
        shell: bash
        run: |
          Xvfb :99 -screen 0 1365x768x24 \
            -ac +extension GLX +render -noreset \
            > /tmp/xvfb.log 2>&1 &

          echo $! > /tmp/xvfb.pid
          sleep 2

      - name: Start Chrome with CDP
        shell: bash
        env:
          DISPLAY: :99
        run: |
          mkdir -p /tmp/remote-chrome-profile

          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --no-first-run \
            --no-default-browser-check \
            --user-data-dir=/tmp/remote-chrome-profile \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            about:blank \
            > /tmp/chrome.log 2>&1 &

          echo $! > /tmp/chrome.pid

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              echo "Chrome CDP is ready."
              exit 0
            fi
            sleep 1
          done

          cat /tmp/chrome.log
          exit 1

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:9222 \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo "=================================="
              echo "REMOTE CHROME URL: $URL"
              echo "=================================="
              break
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          # Keep the browser and tunnel alive.
          sleep 20400

      - name: Print logs
        if: always()
        shell: bash
        run: |
          echo "===== Chrome ====="
          tail -n 60 /tmp/chrome.log 2>/dev/null || true

          echo "===== Xvfb ====="
          tail -n 30 /tmp/xvfb.log 2>/dev/null || true

          echo "===== Cloudflare ====="
          tail -n 60 /tmp/cloudflared.log 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          for f in /tmp/cloudflared.pid /tmp/chrome.pid /tmp/xvfb.pid; do
            if [ -f "$f" ]; then
              kill "$(cat "$f")" 2>/dev/null || true
            fi
          done
