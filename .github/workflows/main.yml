name: Remote Playwright CDP Server
on: 
  workflow_dispatch: 

jobs:
  run-chrome:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Uses dedicated, pre-built infrastructure to get the binary file safely
      - name: Install Cloudflared
        uses: gaplo917/install-cloudflared-action@v1

      - name: Start Xvfb and Google Chrome with CDP
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          
          google-chrome \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --headless=false &
            
          sleep 5

      - name: Start Cloudflare Quick Tunnel & Keep Alive
        run: |
          echo "--------------------------------------------------------"
          echo "STARTING TUNNEL TO CHROME CDP PORT..."
          echo "--------------------------------------------------------"
          
          cloudflared tunnel --url http://127.0.0.1:9222 --http2-origin=true > cloudflared.log 2>&1 &
          
          sleep 10
          cat cloudflared.log
          
          echo "--------------------------------------------------------"
          echo "KEEPING WORKFLOW ALIVE FOR REMOTE PLAYWRIGHT SESSIONS..."
          echo "--------------------------------------------------------"
          
          tail -f cloudflared.log
